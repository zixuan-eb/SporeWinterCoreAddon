modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# We define the spore dependency optional so it loads if spore is present, but doesn't crash visually if missing (or we can make it mandatory)
[[dependencies.${mod_id}]]
    modId="spore"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
