modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# We define the spore dependency as mandatory so players must have the original mod installed.
[[dependencies.${mod_id}]]
    modId="spore"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Create mod is an optional dependency - only needed for Ponder tutorial scenes.
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=false
    versionRange="[0.5,)"
    ordering="NONE"
    side="CLIENT"
